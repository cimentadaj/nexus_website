<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIVITAS Measure Finder — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --ec-orange:#F4B73F; --ec-yellow:#F9D849; --ec-teal:#92C6D0; --ec-pink:#E4769F;
  --ec-navy:#1E3679; --ec-green:#337660; --ec-blue:#2E6CAA; --ec-crimson:#AA2C55;
  --ink:#111111; --muted:#5B5F66; --soft:#F6F6F4; --line:#E6E6E2;
  --ai:#2E6CAA; --ai-line:#C9DAEA; --ai-wash:#F2F6FA;
  --maxw:1120px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#fff;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--ec-yellow)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.tnum{font-variant-numeric:tabular-nums}
.u{box-shadow:inset 0 -.28em 0 var(--ec-yellow)}

/* nav */
nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .bar{max-width:var(--maxw);margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;background:none;border:none;padding:0;cursor:pointer}
.mosaic{display:grid;grid-template-columns:repeat(4,6px);gap:3px;align-items:end;height:28px}
.mosaic span{border-radius:1.5px;display:block;width:6px}
.brand .word{font-weight:800;font-size:15px;line-height:1;text-align:left}
.brand .word small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.navlinks{display:flex;gap:2px;align-items:center}
.navlinks button{border:none;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink);opacity:.6;padding:8px 13px;border-radius:100px;cursor:pointer;transition:all .2s}
.navlinks button:hover{opacity:1;background:var(--soft)}
.navlinks button.on{opacity:1;background:var(--ink);color:#fff}
.shortcut{background:var(--ec-yellow)!important;color:var(--ink)!important;opacity:1!important;font-weight:800!important}
.strip{display:flex;height:4px}
.strip i{flex:1}

/* page head */
h1.sec{font-size:clamp(26px,3.2vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.025em}
.phead{padding:38px 0 20px}
.rule3{display:flex;height:3px;width:120px;margin-top:16px}
.rule3 i{flex:1}
.backlink{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;background:none;border:none;cursor:pointer;padding:0 0 12px;color:var(--muted)}
.backlink:hover{color:var(--ink)}

/* AI language */
.ai-mark{width:9px;height:9px;vertical-align:-1px;flex-shrink:0}
.ai-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ai);margin-left:6px}
.ai-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--ai-line);border-radius:100px;padding:5px 12px 5px 11px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:all .16s}
.ai-chip:hover{border-color:var(--ai)}
.ai-chip.on{background:var(--ec-teal);border-color:var(--ec-teal)}
.ai-chip select{border:none;background:transparent;font-size:11.5px;font-weight:800;cursor:pointer;color:var(--ink);text-transform:none;letter-spacing:0}
.ai-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;transition:color .16s}
.ai-link:hover,.ai-link.on{color:var(--ai)}
.ai-sliver{border-top:1px solid var(--ai-line);padding-top:10px;margin-top:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600;animation:ai-in .16s ease-out}
.ai-sliver .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:14px;font-weight:800;cursor:pointer;line-height:1}
.ai-inset{border:1px solid var(--ai-line);border-radius:10px;background:var(--ai-wash);padding:14px 16px;margin:14px 0;animation:ai-in .16s ease-out;transition:border-color .14s}
.ai-inset:hover{border-color:var(--ai)}
.ai-inset .b{font-size:13.5px;line-height:1.6;margin-top:8px}
.ai-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-facts span{font-size:11.5px;font-weight:700;background:#fff;border:1px solid var(--ai-line);border-radius:6px;padding:3px 9px}
.ai-facts .no{color:var(--ec-crimson)}
.ai-facts .ok{color:var(--ec-green)}
.ai-warn{background:none;border:none;padding:0;margin-top:5px;font-size:10.5px;font-weight:800;color:var(--ec-crimson);cursor:pointer;letter-spacing:.04em;display:block;text-align:left}
@keyframes ai-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.acts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 0}
@media(max-width:640px){.acts2{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:12px;border:1.5px solid;cursor:pointer;text-align:left;background:#fff;transition:all .18s;font-family:inherit}
.tile .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.tile .tt{font-size:14.5px;font-weight:800;line-height:1.25;display:block}
.tile .ts{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;display:block}
.tile.ai{border-color:var(--ai-line);background:var(--ai-wash)}
.tile.ai .ic{background:var(--ai);color:#fff}
.tile.ai:hover{border-color:var(--ai)}
.tile.ai.on{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.tile.src{border-color:var(--line)}
.tile.src .ic{background:var(--ec-yellow);color:var(--ink)}
.tile.src:hover{border-color:var(--ink)}
.ai-mark.lg{width:16px;height:16px}

/* buttons */
.btn{border:none;background:var(--ink);color:#fff;font-size:13px;font-weight:800;border-radius:100px;padding:10px 20px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{background:var(--ec-navy)}
.btn.ghost{background:#fff;border:2px solid var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{font-size:12px;padding:7px 15px}
.tbtn{background:none;border:none;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 2px}
.tbtn:hover{color:var(--ink);text-decoration:underline}

/* index */
.app{display:grid;grid-template-columns:212px 1fr;gap:38px;padding:8px 0 90px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr;gap:22px}}
.side{position:sticky;top:88px}
@media(max-width:900px){.side{position:static}}
.fgroup{margin-bottom:22px}
.flabel{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .cnt{opacity:.5;font-weight:800;margin-left:2px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.rcount{font-size:13px;font-weight:700;color:var(--muted)}
.rcount b{font-size:20px;font-weight:800;color:var(--ink)}
.sortsel{border:none;background:none;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:right}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.mlist .empty{grid-column:1/-1}
.mcard{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:12px;padding:18px 18px 16px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 18px 34px -24px rgba(17,17,17,.4)}
.meta{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.meta .code{color:var(--ec-crimson);font-weight:800}
.mcard .meta{padding-right:26px}
.mcard h3{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.01em;margin:7px 0 auto;padding-bottom:12px}
.headline{font-size:13px;font-weight:700;padding-top:12px;border-top:1px solid var(--line)}
.headline .v{color:var(--ec-green);font-weight:800}
.addbtn{position:absolute;top:12px;right:11px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;opacity:0;transition:all .16s;line-height:1}
.mcard:hover .addbtn,.mcard:focus-within .addbtn,.addbtn.in{opacity:1}
.addbtn:hover{border-color:var(--ink);color:var(--ink)}
.addbtn.in{background:var(--ec-green);border-color:var(--ec-green);color:#fff}
.cite{display:inline-flex;align-items:center;background:var(--ec-yellow);border:none;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:800;cursor:pointer;color:var(--ink);transition:all .16s}
.cite:hover{background:var(--ink);color:var(--ec-yellow)}
.tvoid{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:5px;padding:2px 8px;display:inline-block}
.empty{padding:50px 0;text-align:center}
.empty p{font-size:15px;font-weight:700;max-width:400px;margin:0 auto 16px}

/* measure card */
.mpage{max-width:760px;margin:0 auto;padding-bottom:90px}
.factline{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}
.sect{margin-top:34px}
.sect h3{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.quote{position:relative;border-left:4px solid var(--ec-teal);padding:2px 0 2px 18px;margin-bottom:12px;font-size:15.5px;line-height:1.65;font-style:italic}
.quote .qf{display:flex;align-items:center;gap:8px;margin-top:9px;font-style:normal}
.flagq{background:none;border:none;color:var(--line);cursor:pointer;font-size:12px;opacity:0;transition:opacity .16s}
.quote:hover .flagq{opacity:1}
.flagq:hover{color:var(--ec-crimson)}
.res{background:var(--ec-navy);color:#fff;border-radius:14px;padding:24px}
.res .n{font-size:clamp(32px,4.4vw,48px);font-weight:800;line-height:1;color:var(--ec-yellow)}
.res .l{font-size:14px;font-weight:700;margin-top:7px;color:#C7D0EA}
.res .q{font-size:13px;color:#B9C4E4;margin-top:13px;font-style:italic;line-height:1.5}
.caveat{font-size:12.5px;font-weight:700;color:var(--ec-crimson);margin-top:12px;display:flex;gap:8px}
.voidrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.xlinks{display:flex;flex-wrap:wrap;gap:7px;font-size:13px;font-weight:700}
.xlinks button{background:none;border:none;color:var(--ink);cursor:pointer;font-weight:700;font-size:13px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.xlinks button:hover{text-decoration-color:var(--ink)}
.xlinks .sep{color:var(--line)}

/* peers */
.ctlline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:700;margin-bottom:6px}
.ctlline select{border:none;border-bottom:2px solid var(--ink);background:none;font-size:15px;font-weight:800;padding:3px 2px;cursor:pointer}
.seg{display:inline-flex;background:var(--soft);border-radius:100px;padding:3px}
.seg button{border:none;background:none;font-size:12.5px;font-weight:800;color:var(--muted);padding:6px 14px;border-radius:100px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--ink);color:#fff}
.ctlsub{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0 18px}
.hintline{font-size:12.5px;font-weight:600;color:var(--muted)}
.hintline b{color:var(--ink);font-weight:800}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-top:6px}

.prow{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;padding:15px 44px 15px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .18s}
.prow:hover{background:var(--soft)}
.prank{font-size:14px;font-weight:800;color:var(--muted);padding-top:2px}
.pcity{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 7px}
.pchips span{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:5px;padding:2px 8px}
.pchips span.warn{color:var(--ec-crimson)}
.pmeas{font-size:13.5px;font-weight:700}
.pmeas em{font-style:normal;color:var(--muted);font-weight:600}

/* shortlist */
.slhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.cmp{overflow-x:auto}
table.cmpt{border-collapse:collapse;width:100%;min-width:600px}
table.cmpt th,table.cmpt td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
table.cmpt tbody th{width:132px;font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
table.cmpt thead th{font-size:13px;font-weight:800;padding-bottom:16px}
table.cmpt thead th span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.uwarn{text-decoration:underline;text-decoration-color:var(--ec-crimson);text-decoration-thickness:2px;text-underline-offset:3px}

/* map */
.map{position:relative;background:var(--ec-navy);border-radius:14px;aspect-ratio:72.5/100;overflow:hidden}

.mapfoot{position:absolute;left:12px;right:12px;bottom:10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);display:flex;justify-content:space-between;gap:8px;z-index:3}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.cshape{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.22);stroke-width:.18;transition:fill .18s}
.cshape.out{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.10)}
.cshape.lit{fill:rgba(146,198,208,.18)}
.cshape.home{fill:rgba(249,216,73,.16);stroke:rgba(249,216,73,.55);stroke-width:.3}
.cshape.c0{fill:rgba(255,255,255,.06)}
.cshape.c1{fill:rgba(146,198,208,.30)}
.cshape.c2{fill:rgba(146,198,208,.55)}
.cshape.c3{fill:rgba(146,198,208,.85)}
.cshape.c1:hover,.cshape.c2:hover,.cshape.c3:hover{fill:var(--ec-yellow)}
.insetbox{fill:none;stroke:rgba(255,255,255,.25);stroke-width:.18;stroke-dasharray:1 1}
.insetlbl{font-size:2.1px;font-weight:700;fill:rgba(255,255,255,.45)}
.map .mdot{cursor:pointer}
.map .mdot circle{fill:#fff;stroke:var(--ec-navy);stroke-width:.6;transition:r .18s,fill .18s;filter:drop-shadow(0 .4px .8px rgba(0,0,0,.55))}
.map .mdot:hover circle,.map .mdot.hot circle{fill:var(--ec-yellow);r:3.1}
.map .mdot.me circle{fill:var(--ec-yellow);stroke:rgba(249,216,73,.3);stroke-width:1.8}
.map .mdot .rk{font-size:2.5px;font-weight:800;fill:var(--ec-navy);text-anchor:middle;pointer-events:none}
.map .mdot .mlbl{font-size:3px;font-weight:800;fill:#fff;text-anchor:middle;opacity:0;transition:opacity .18s;pointer-events:none;paint-order:stroke;stroke:rgba(17,17,17,.8);stroke-width:.9}
.map .mdot:hover .mlbl,.map .mdot.hot .mlbl{opacity:1}
.map .mdot.me .mlbl{opacity:1;fill:var(--ec-yellow)}

.ppreview{border-left:3px solid var(--tc);padding:0 0 0 18px;animation:ai-in .16s ease-out}
.pvtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.pvrank{font-size:13px;font-weight:800;color:var(--muted)}
.pvh{font-size:21px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin:6px 0 7px}
.pvfacts{font-size:12.5px;font-weight:700;color:var(--muted)}
.pvres{margin-top:16px;font-size:14px;font-weight:700}
.pvres .v{color:var(--ec-green);font-weight:800;font-size:20px;margin-right:6px}
.pvacts{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.pvhint{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:14px}
.map .mdot.sel circle{fill:var(--ec-yellow);stroke:#fff;stroke-width:1}
.map .mdot.sel .mlbl{opacity:1;fill:var(--ec-yellow)}

.peergrid{display:grid;grid-template-columns:296px 1fr;gap:30px;align-items:start}
@media(max-width:820px){.peergrid{grid-template-columns:1fr}}
.prow.hot{background:var(--soft)}
.covwrap{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;margin-top:16px}
@media(max-width:760px){.covwrap{grid-template-columns:1fr}}
.covstat{font-size:13.5px;line-height:1.6}
.covstat b{font-size:22px;font-weight:800}
.covlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.covlist span{font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);border-radius:5px;padding:3px 8px}

/* assessment */
.ai-report{border:1px solid var(--ai-line);border-top:3px solid var(--ai);border-radius:12px;background:#fff;padding:22px 24px;margin-top:24px;animation:ai-in .16s ease-out}
.ai-report .rhd{display:flex;align-items:center;gap:0;margin-bottom:18px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:760px){.rgrid{grid-template-columns:1fr;gap:18px}}
.rl{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.ai-report ul{list-style:none}
.ai-report li{font-size:13.5px;line-height:1.55;margin-bottom:10px;padding-left:15px;position:relative}
.ai-report li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--ec-teal)}
.rgrid>div:nth-child(2) li::before{background:var(--ec-crimson)}
.rwatch{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.rwatch li::before{background:var(--ec-orange)!important}
.fq{margin-top:22px;font-size:14px;font-weight:800}
.fa{font-size:13.5px;line-height:1.6;margin-top:7px;padding-left:14px;border-left:2px solid var(--ai-line)}
.rfollow{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:7px}
.fchip{background:var(--ai-wash);border:1px solid var(--ai-line);border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .16s}
.fchip:hover{border-color:var(--ai);background:#fff}
.racts{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}

/* ask */
.askpage{background:var(--soft)}
body{overflow-x:hidden}
.askcol{max-width:720px;margin:0 auto;padding:78px 28px 110px}
.kick{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px}
.bar3{display:inline-flex;gap:3px}
.bar3 i{width:4px;height:13px;border-radius:2px}
.framing{font-size:clamp(24px,3vw,30px);font-weight:800;line-height:1.2;letter-spacing:-.02em;margin:14px 0 32px;max-width:600px}
.field{background:#fff;border:1.5px solid var(--ink);border-radius:22px;padding:22px 24px;transition:box-shadow .2s,border-width .1s}
.field:focus-within{box-shadow:0 16px 40px -22px rgba(17,17,17,.45)}
.field.asking{opacity:.5;position:relative;overflow:hidden}
.field.asking::after{content:'';position:absolute;left:0;bottom:0;height:2px;background:var(--ec-yellow);animation:fill 1.2s linear forwards}

function closeness(m,c){
  const b=Math.abs(bandOrder.indexOf(m.band)-bandOrder.indexOf(c.band));
  const r=m.density/c.density, d=r>1?r:1/r;
  return {band:b,dens:d,sameCountry:m.country===c.country,
          sameNet:c.civinet!=='—'&&m.civinet===c.civinet,
          score:b*2+(d<1.5?0:d<3?1:2)+(m.country===c.country?0:1)};
}
function isClose(m,c){const k=closeness(m,c);return k.band===0&&k.dens<3&&(k.sameCountry||k.sameNet||k.band===0);}

function peerList(cityName,preset,themeId){
  const c=CITIES[cityName]; if(!c)return [];
  let pool=M.filter(m=>m.city!==cityName);
  if(themeId)pool=pool.filter(m=>m.theme===themeId);
  const rows=pool.map(m=>{
    const k=closeness(m,c), sameBand=m.band===c.band;
    if(preset==='national'&&!k.sameCountry&&!k.sameNet)return null;
    return {city:m.city,m:m.id,
      score:preset==='similar'?k.score:(k.sameCountry?0:1)+k.band,
      chips:[fmt(m.pop),fmt(m.density)+'/km²',m.country],
      bandWarn:!sameBand};
  }).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,5);
  if(preset==='national'&&c.civinet!=='—'){
    const seen=new Set(rows.map(r=>r.city));
    const miss=Object.entries(CITIES).find(([n,v])=>n!==cityName&&v.civinet===c.civinet&&!seen.has(n));
    if(miss)rows.push({city:miss[0],m:null,score:99,chips:[fmt(miss[1].pop),miss[1].country],unres:true});
  }
  return rows;
}
function suitability(m,cityName){
  const c=CITIES[cityName], k=closeness(m,c);
  const rows=[
    {k:'Size',ok:k.band===0,v:`${pop(m.pop)} vs ${pop(c.pop)}`},
    {k:'Density',ok:k.dens<1.5,v:k.dens<1.5?'comparable':`${k.dens.toFixed(1)}× apart`},
    {k:'Law',ok:k.sameCountry,v:k.sameCountry?'same state':m.country},
    {k:'Evidence',ok:!!m.result&&!m.result.note,v:m.result?(m.result.note?'one figure, caveated':'one figure'):'none reported'}
  ];
  const bad=rows.filter(r=>!r.ok);
  const verdict=!bad.length?'Transferable on every attribute the index holds.'
    :bad.length===1?`Broadly transferable — ${bad[0].k.toLowerCase()} is the one gap.`
    :`Partially transferable — the instrument travels, ${list3(bad.map(r=>r.k.toLowerCase()))} do not.`;
  const alt=M.filter(x=>x.theme===m.theme&&x.id!==m.id&&x.result)
             .sort((a,b)=>closeness(a,c).score-closeness(b,c).score)[0];
  return {rows,verdict,alt:alt&&closeness(alt,c).score<closeness(m,c).score?alt:null};
}

const MB={la0:34,la1:71.5,lo0:-11.5,lo1:32.5,xw:72.5};
function proj(lat,lon){
  if(lat<MB.la0)return null;
  return {x:(lon-MB.lo0)/(MB.lo1-MB.lo0)*MB.xw,
          y:(MB.la1-lat)/(MB.la1-MB.la0)*100};
}
function basemap(fillFn,extraFn){
  return Object.keys(GEO).map(n=>{
    const f=fillFn?fillFn(n):null;
    return `<path d="${GEO[n]}" class="cshape${f&&f.cls?' '+f.cls:''}" ${extraFn?extraFn(n):''}><title>${esc(n)}${f&&f.title?' — '+esc(f.title):''}</title></path>`;
  }).join('');
}
function cityMark(name,cls,label,extra,rank){
  const c=COORD[name]; if(!c)return '';
  const q=proj(c[0],c[1]);
  if(!q)return `<g class="mdot ${cls}" ${extra||''}><title>${esc(label||name)} — Canarias, shown inset</title>
    <circle cx="5" cy="93" r="${cls==='me'?2.3:1.9}"/>${rank?`<text x="5" y="93.7" class="rk">${rank}</text>`:''}</g>`;
  return `<g class="mdot ${cls}" ${extra||''}><title>${esc(label||name)}</title>
    <circle cx="${q.x.toFixed(2)}" cy="${q.y.toFixed(2)}" r="${cls==='me'?2.4:2.0}"/>
    ${rank?`<text x="${q.x.toFixed(2)}" y="${(q.y+0.85).toFixed(2)}" class="rk">${rank}</text>`:''}
    <text x="${q.x.toFixed(2)}" y="${(q.y-3.6).toFixed(2)}" class="mlbl">${esc(name)}</text></g>`;
}

const MQ=[{id:'councillor',q:'What would a councillor question?'},
          {id:'compare',q:'How does it compare with others in this theme?'},
          {id:'check',q:'What would I check locally?'}];
function mAnswer(id,m){
  const c=CITIES[S.myCity];
  if(id==='councillor'){
    const bits=[];
    if(m.result&&m.result.note)bits.push(`the source's own caveat — ${m.result.note.replace(/\.$/,'').toLowerCase()}`);
    if(!m.result)bits.push('that the source reports no outcome at all, only what was implemented');
    const nr=m.notReported.filter(n=>n.t!=='na').map(n=>n.f.toLowerCase());
    if(nr.length)bits.push(`the missing ${list3(nr)}`);
    if(closeness(m,c).band!==0)bits.push(`the size gap — ${pop(m.pop)} against ${pop(c.pop)} in ${S.myCity}`);
    return bits.length?`Expect ${list3(bits)}. All of it is on this page already, so quote it before someone else finds it.`
      :'Nothing on this card is qualified by the source and the size band matches — the weak point would be that a single case is not an evidence base.';
  }
  if(id==='compare'){
    const sib=M.filter(x=>x.theme===m.theme&&x.id!==m.id);
    const withRes=sib.filter(x=>x.result);
    if(!withRes.length)return `No other ${theme(m.theme).full.toLowerCase()} measure in the index reports an outcome, so there is nothing to compare this against.`;
    return `${sib.length} other ${theme(m.theme).full.toLowerCase()} measure${sib.length>1?'s':''} are indexed; ${withRes.length} report a figure — ${list3(withRes.map(x=>`${x.city} ${x.result.v}`))}. They measure different things, so read them side by side rather than against each other.`;
  }
  const s2=suitability(m,S.myCity), bad=s2.rows.filter(r=>!r.ok);
  return bad.length?`Check ${list3(bad.map(r=>({Size:'whether the scale makes sense at your size',Density:'whether the density difference changes the effect',Law:'whether the legal basis exists in your national law',Evidence:'whether one reported figure is enough for your council'})[r.k]))}. None of it is in the CIVITAS documents.`
    :`The four attributes match ${S.myCity}, so the checks are operational: enforcement capacity, budget line and political timing — none of which the corpus covers.`;
}

/* ══════════════ 4 · SHORTLIST ══════════════ */
function unitOf(m){if(!m.result)return null;let w=m.result.l.replace(/^[^a-zA-Z]*/,'').split(',')[0].split(' ').slice(0,3);
  while(w.length>1&&/^(at|in|inside|of|on|the|per|for|to)$/i.test(w[w.length-1]))w.pop();
  return w.join(' ');}
function vShortlist(){

  if(!items.length)return `<div class="wrap"><div class="phead"><h1 class="sec">Shortlist</h1></div>

    <div class="phead"><h1 class="sec">Shortlist <span class="tnum" style="font-size:18px;color:var(--muted)">${items.length}/5</span></h1></div>
    <div class="slhead">
      <button class="btn" onclick="brief()">Generate council brief</button>
      <button class="tbtn" onclick="toast('CSV exported')">Export CSV</button>
      <button class="tbtn" onclick="S.shortlist=[];render()">Clear</button>
    </div>
    <div class="cmp"><table class="cmpt">
      <thead><tr><th></th>${items.map(m=>`<th>${esc(m.title)}<span>${m.code} · ${m.city}, ${m.cc} · ${pop(m.pop)} · ${m.years}</span></th>`).join('')}</tr></thead>
      <tbody>${rows.map(([lab,fn])=>`<tr><th>${lab}${lab==='Result'&&mixed?`<button class="ai-warn" aria-expanded="${S.aiUnits}" onclick="S.aiUnits=!S.aiUnits;render()">⚠ mixed units</button>
        ${S.aiUnits?`<div style="font-weight:600;font-size:11.5px;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:7px;line-height:1.45">
          ${withRes.map(m=>`${m.city} reports ${esc(unitOf(m))}`).join(', ')}. No honest single figure.
          <button class="tbtn" style="font-size:11.5px;padding:4px 0" onclick="S.aiUnits=false;go('measures')">Find a like-for-like measure →</button></div>`:''}`:''}</th>
        ${items.map(m=>`<td>${fn(m)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${assessBlock(items)}
  </div></div>`;
}
function assessBlock(items){
  if(items.length<2)return `<div style="margin-top:22px"><button class="ai-link" onclick="S.aiAssess=true;render()">${AIMARK} Draft an assessment</button>
    <span style="font-size:12px;color:var(--muted);font-weight:600;margin-left:8px">add one more measure to compare</span></div>`;
  if(!S.aiAssess)return `<div style="margin-top:22px"><button class="ai-link" onclick="S.aiAssess=true;render()">${AIMARK} Draft an assessment of these ${items.length}</button></div>`;
  const a=assess();
  return `<div class="ai-report">
    <div class="rhd"><span style="color:var(--ai)">${AIMARK}</span><span class="ai-label">Drafted · from ${items.length} shortlisted</span>
      <button class="tbtn" style="margin-left:auto" onclick="S.aiAssess=false;S.follow=[];render()">Hide</button></div>
    <div class="rgrid">
      <div><div class="rl">In favour</div><ul>${a.pros.map(x=>`<li>${esc(x.t)} ${x.m?citeFor(x.m):''}</li>`).join('')}</ul></div>
      <div><div class="rl">Against</div><ul>${a.cons.map(x=>`<li>${esc(x.t)} ${x.m?citeFor(x.m):''}</li>`).join('')}</ul></div>
    </div>

    </div>
    <div class="racts"><button class="btn sm" onclick="brief()">Put this in the council brief</button>
      <button class="tbtn" onclick="toast('Assessment copied')">Copy</button></div>

function citeFor(id){const m=byId(id);return m?`<button class="cite" onclick="ev('${id}'${m.result?",'r'":''})">p.${m.result?m.result.p:m.implemented[0].p}</button>`:''}

/* ══════════════ SHORTLIST ASSESSMENT (drafted) ══════════════ */
function assess(){
  const items=S.shortlist.map(byId).filter(Boolean), c=CITIES[S.myCity];
  const withRes=items.filter(m=>m.result), noRes=items.filter(m=>!m.result);
  const clean=withRes.filter(m=>!m.result.note), caveated=withRes.filter(m=>m.result.note);
  const sameLaw=items.filter(m=>m.country===c.country);
  const sizeOk=items.filter(m=>closeness(m,c).band===0);
  const costed=items.filter(m=>!m.cost.startsWith('Not'));
  const mixed=new Set(withRes.map(unitOf)).size>1;

  const pros=[];
  clean.forEach(m=>pros.push({t:`${m.city} reports ${m.result.v} — ${m.result.l} — with no caveat attached by the source.`,m:m.id}));
  if(sameLaw.length)pros.push({t:`${list3(sameLaw.map(m=>m.city))} ${sameLaw.length>1?'sit':'sits'} under the same national law as ${S.myCity}, so the legal instrument does not have to be invented.`,m:sameLaw[0].id});
  if(sizeOk.length)pros.push({t:`${list3(sizeOk.map(m=>m.city))} ${sizeOk.length>1?'are':'is'} in your population band, which is the comparison a councillor will accept fastest.`,m:sizeOk[0].id});
  if(costed.length)pros.push({t:`${costed.length} of ${items.length} report a cost figure, so the paper can carry a number rather than an estimate.`,m:costed[0].id});

  const cons=[];
  noRes.forEach(m=>cons.push({t:`${m.city} has no reported outcome at all — the source describes what was done, never what changed.`,m:m.id}));
  caveated.forEach(m=>cons.push({t:`${m.city}'s ${m.result.v} carries the source's own caveat: ${m.result.note.replace(/\.$/,'').toLowerCase()}.`,m:m.id}));
  const farSize=items.filter(m=>closeness(m,c).band>1);
  if(farSize.length)cons.push({t:`${list3(farSize.map(m=>m.city))} ${farSize.length>1?'are':'is'} more than one size band away from ${S.myCity}; expect that to be the first objection.`,m:farSize[0].id});
  const noCost=items.filter(m=>m.cost.startsWith('Not'));
  if(noCost.length)cons.push({t:`${list3(noCost.map(m=>m.city))} report no cost, so nothing here supports a budget line.`,m:noCost[0].id});

  const watch=[];
  if(mixed)watch.push(`These measures report different indicators — ${list3([...new Set(withRes.map(unitOf))])}. Never combine them into one figure.`);
  if(caveated.length)watch.push(`Quote the caveats in the paper before someone else finds them: ${caveated.length} of ${withRes.length} reported figures are qualified by the source itself.`);
  watch.push(`Nothing here reports cost-effectiveness, retail impact or what happened after the funding ended — those are absent from the CIVITAS corpus, not from this shortlist.`);
  if(items.some(m=>m.years.slice(-4)>='2026'))watch.push(`At least one measure is a Living Lab still running; its outcome column will stay empty until the project publishes.`);

  return {items,pros:pros.slice(0,4),cons:cons.slice(0,4),watch:watch.slice(0,3),mixed};
}
const FOLLOWUPS=[
 {id:'closest',q:'Which of these is closest to my city?'},
 {id:'gaps',q:'What is missing across all of them?'},
 {id:'order',q:'How should I order them in the paper?'}
];
function followAnswer(id,a){
  const c=CITIES[S.myCity], items=a.items;
  if(id==='closest'){
    const ranked=[...items].sort((x,y)=>closeness(x,c).score-closeness(y,c).score);
    const b=ranked[0], k=closeness(b,c);
    return `${b.city} — ${k.band===0?'same population band':'closest population band'}, ${k.dens<1.5?'comparable density':'density '+k.dens.toFixed(1)+'× apart'}, ${k.sameCountry?'same national law':b.country+' law'}${b.result?`, and it reports ${b.result.v}`:', though it reports no outcome'}. Lead with it.`;
  }
  if(id==='gaps'){
    const fields=[...new Set(items.flatMap(m=>m.notReported.map(n=>n.f)))];
    return `Across all ${items.length}: ${list3(fields.slice(0,3))} ${fields.length>3?`and ${fields.length-3} more fields `:''}are absent. ${items.filter(m=>!m.result).length} of ${items.length} report no outcome. None reports what happened after the funding ended.`;
  }
  const withRes=items.filter(m=>m.result), rest=items.filter(m=>!m.result);
  const ranked=[...withRes].sort((x,y)=>closeness(x,c).score-closeness(y,c).score);
  return `Open with ${ranked[0]?ranked[0].city:items[0].city} — closest to ${S.myCity} and it carries a number. ${ranked[1]?`Put ${ranked[1].city} second as corroboration. `:''}${rest.length?`Keep ${list3(rest.map(m=>m.city))} in an annex: ${rest.length>1?'they are':'it is'} relevant but ${rest.length>1?'carry':'carries'} no outcome to quote.`:'Leave the weakest evidence out rather than inviting the question.'}`;
}

function renderSheet(){

  </div>
  <button class="askagain" onclick="S.askState='idle';S.askQ='';render();setTimeout(()=>$('askin')&&$('askin').focus(),40)">Ask another question</button>`;
}
function srow(m,i){
  if(!m)return '';

  </div>`;
}
const norm=x=>String(x).toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function setAsk(q){S.askQ=q;S.askManual=false;render();doAsk();}
function doAsk(){
  const raw=(S.askQ||'').trim(); if(raw.length<8){toast('Type a question first');return;}
  const q=norm(raw);
  const es=/\b(que|como|cual|donde|ciudades|calles|escolar|colegio|emisiones|zbe|logistica|reparto|sabe)\b/.test(q);
  const en=/\b(what|which|how|when|where|did|does|do|the|have|has|been|cities|about|not|know)\b/.test(q);
  if(!S.askManual){if(es&&!en)S.askLang='es';else if(en&&!es)S.askLang='en';}
  S.askDetected=true;S.askHL=null;
  S.askState='loading';render();
  setTimeout(()=>{S.askHit=ANSWERS.find(a=>a.k.some(k=>q.includes(norm(k))))||null;S.askState='done';render();},1200);
}
function addMany(ids){ids.forEach(id=>{if(!S.shortlist.includes(id)&&S.shortlist.length<5)S.shortlist.push(id)});render();toast('Added to shortlist');}

/* ══════════════ ACTIONS ══════════════ */
function tog(k,v){const a=S.f[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render();}
function togRes(){S.f.result=!S.f.result;render();}
function clearF(){S.f={theme:[],continent:[],region:[],result:false};render();}
function tsl(id){
  S.follow=[];
  const i=S.shortlist.indexOf(id);
  if(i<0){if(S.shortlist.length>=5){toast('Shortlist holds five');return;}S.shortlist.push(id);toast('Added to shortlist');}
  else{S.shortlist.splice(i,1);toast('Removed');}
  render();
}
function extlink(w){toast('Opens '+w+' on civitas.eu (demo)');}

function ev(mid,which){
  S.evM=mid; S.evPage=which===undefined?0:which; S.evFollow=[];
  openModal('','', '', '', 'wide');
  evRender();
}
function evPages(m){
  const out=m.implemented.map((q,i)=>({k:i,p:q.p,doc:q.doc,label:i===0?'What they did':'Enforcement detail',span:q.q}));
  if(m.result)out.push({k:'r',p:m.result.p,doc:m.result.doc,label:'Result',span:m.result.q});
  return out;
}
function evRender(){
  const m=byId(S.evM); if(!m)return;
  const pages=evPages(m), cur=pages.find(x=>String(x.k)===String(S.evPage))||pages[0];
  const doc=DOCS[cur.doc], su=suitability(m,S.myCity), inSl=S.shortlist.includes(m.id);
  const filler='Evaluation activities in this work package followed the CIVITAS process and impact evaluation framework, applying the common indicator set to each measure at city level. Data collection combined automatic counts, municipal registers and a household survey administered before and after implementation.';
  $('mt').textContent=m.code+' — '+m.city;
  $('ms').textContent=doc.t;
  $('mb').innerHTML=`<div class="evgrid">
    <div class="evmain">
      <div class="evtabs">${pages.map(x=>`<button class="evtab ${String(x.k)===String(cur.k)?'on':''}" onclick="S.evPage='${x.k}';evRender()">${x.label} <span class="tnum">p.${x.p}</span></button>`).join('')}</div>
      <div class="pdfmeta"><span>Page <b class="tnum">${cur.p}</b> of <b class="tnum">${doc.pages}</b></span><span>Language <b>${doc.lang}</b></span><span>Project <b>${m.project}</b></span></div>
      <div class="pdfpage"><h4>${esc(m.code)} — ${esc(m.city)}</h4><p>${filler}</p>
        <p style="margin-top:14px"><span class="hl">${esc(cur.span)}</span></p>
        <p style="margin-top:14px">Further detail on the monitoring protocol and the treatment of missing observations is provided in Annex B.</p></div>
    </div>
    <aside class="evside">
      <div><span style="color:var(--ai)">${AIMARK}</span><span class="ai-label">Matched on 4 attributes</span></div>
      <div class="evverdict">${esc(su.verdict)}</div>
      <div class="ai-facts">${su.rows.map(r=>`<span class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'} ${r.k} ${esc(r.v)}</span>`).join('')}</div>
      ${su.alt?`<button class="btn ghost sm" style="margin-top:12px" onclick="closeModal();go('measure','${su.alt.id}')">Closer precedent: ${su.alt.city} →</button>`:''}
      ${S.evFollow.map(f=>`<div class="fq">${esc(MQ.find(x=>x.id===f).q)}</div><div class="fa">${esc(mAnswer(f,m))}</div>`).join('')}
      ${MQ.filter(x=>!S.evFollow.includes(x.id)).length?`<div class="evasklbl">Ask about this source</div>
        <div class="fchips">${MQ.filter(x=>!S.evFollow.includes(x.id)).map(x=>`<button class="fchip" onclick="S.evFollow.push('${x.id}');evRender()">${esc(x.q)}</button>`).join('')}</div>`:''}
    </aside>
  </div>`;
  $('mf').innerHTML=`<span class="demotag" style="margin-right:auto">Demo — rendered page</span>
    <button class="btn ghost sm" onclick="extlink('the resource')">Open on civitas.eu ↗</button>
    <button class="btn sm ${inSl?'added':''}" onclick="tslQuiet('${m.id}');evRender()">${inSl?'✓ In shortlist':'Add to shortlist'}</button>`;
}
function tslQuiet(id){
  const i=S.shortlist.indexOf(id);
  if(i<0){if(S.shortlist.length>=5){toast('Shortlist holds five');return;}S.shortlist.push(id);toast('Added to shortlist');}
  else{S.shortlist.splice(i,1);toast('Removed');}
  $('slcount').textContent=S.shortlist.length;
}
function brief(){
  const items=S.shortlist.map(byId).filter(Boolean);
  if(!items.length){toast('Shortlist a measure first');return;}
  const es=S.askLang==='es', refs=[];
  items.forEach(m=>{refs.push(`${m.code} — ${DOCS[m.implemented[0].doc].t}, p.${m.implemented[0].p}`);
    if(m.result)refs.push(`${m.code} — ${DOCS[m.result.doc].t}, p.${m.result.p}`);});
  openModal('Council brief — draft','Editable DOCX · '+(es?'Español':'English'),
  `<div class="brief">
    <h2>${es?'Opciones de movilidad basadas en evidencia europea':'Mobility options grounded in European evidence'}</h2>
    <div class="bsub">${es?'Nota para el pleno':'Note for council'} · ${esc(S.myCity)}</div>
    <h3>1. ${es?'Qué han hecho ciudades comparables':'What comparable cities did'}</h3>
    <ul>${items.map((m,i)=>`<li><b>${m.city}</b> — ${esc(m.title.toLowerCase())}, ${m.years}.<sup>[${i*2+1}]</sup></li>`).join('')}</ul>
    <h3>2. ${es?'Qué resultados declararon':'What they reported'}</h3>
    <ul>${items.map((m,i)=>m.result?`<li><b>${m.city}:</b> ${m.result.v} — ${esc(m.result.l)}.<sup>[${i*2+2}]</sup></li>`:`<li><b>${m.city}:</b> ${es?'sin resultado declarado.':'no quantified outcome reported.'}</li>`).join('')}</ul>
    <h3>3. ${es?'Lo que no se sabe':'What is not known'}</h3>
    <ul><li>${es?'Coste por tonelada evitada: no está en la base de evidencia.':'Cost per tonne avoided: not in the CIVITAS evidence base.'}</li></ul>
    <div class="annex"><h4>${es?'Anexo':'Annex'}</h4><ol>${refs.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>
  </div>`,
  `<span class="demotag" style="margin-right:auto">Demo — preview</span><button class="btn ghost sm" onclick="toast('DOCX downloaded')">Download DOCX</button><button class="btn sm" onclick="closeModal()">Close</button>`);
}
let lastFocus=null;
function openModal(t,s,b,f,cls){lastFocus=document.activeElement;document.querySelector('.modal').className='modal'+(cls?' '+cls:'');$('mt').textContent=t;$('ms').textContent=s;$('mb').innerHTML=b;$('mf').innerHTML=f||'';$('ovl').classList.add('open');document.body.style.overflow='hidden';$('ovl').querySelector('.xbtn').focus();}
function closeModal(){$('ovl').classList.remove('open');document.body.style.overflow='';if(lastFocus)lastFocus.focus();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ovl').classList.contains('open'))closeModal();});

go('measures');
</script>
</body>
</html>
